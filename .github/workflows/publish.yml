name: publish

# The proxy is an end-app (nothing depends on meridian-proxy as a Maven artifact; modules are
# loaded at runtime, not compiled against it). So publishing = attach the runnable uber-jar + a
# meridian.json descriptor to the GitHub Release. meridian-api / meridian-protocol are published
# from their own repos to GitHub Packages, and consumed here from there.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write   # upload release assets
  packages: read    # pull meridian-api / meridian-protocol from Packages

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
          cache: maven

      - name: Maven settings (GitHub Packages auth for api + protocol)
        run: |
          cat > "$GITHUB_WORKSPACE/settings.xml" <<'EOF'
          <settings>
            <servers>
              <server><id>github-meridian-api</id><username>${env.GITHUB_ACTOR}</username><password>${env.GITHUB_TOKEN}</password></server>
              <server><id>github-meridian-protocol</id><username>${env.GITHUB_ACTOR}</username><password>${env.GITHUB_TOKEN}</password></server>
            </servers>
          </settings>
          EOF

      - name: Build the runnable proxy jar
        run: mvn -B -ntp -DskipTests package -s "$GITHUB_WORKSPACE/settings.xml"
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach jar + meridian.json to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(mvn -q -ntp -o -pl meridian-proxy -Dexpression=project.version -DforceStdout help:evaluate)
          PROTO=$(mvn -q -ntp -o -Dexpression=meridian.protocol.version -DforceStdout help:evaluate)
          JAR=$(ls meridian-proxy/target/*-all.jar | head -1)
          SHA=$(sha256sum "$JAR" | cut -d' ' -f1)
          cat > meridian.json <<EOF
          {
            "kind": "proxy",
            "id": "meridian-proxy",
            "version": "${VERSION}",
            "proto": ${PROTO},
            "asset": "$(basename "$JAR")",
            "sha256": "${SHA}"
          }
          EOF
          echo "Publishing $(basename "$JAR") (proto ${PROTO}) to release ${{ github.event.release.tag_name }}"
          gh release upload "${{ github.event.release.tag_name }}" "$JAR" meridian.json --clobber
